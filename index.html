<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc" id="meta-theme-color">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="manifest" href="./manifest.json">
  <title>Finanzas Pro</title>

  <script>
    (function () {
      var t = localStorage.getItem('finanzas-theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --t1: #0f172a;
      --t2: #64748b;
      --t3: #94a3b8;
      --accent: #f97316;
      --accent-grad: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
      --income: #10b981;
      --expense: #ef4444;
      --savings: #f59e0b;
      --r: 18px;
      --sh: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #020617;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --t1: #f8fafc;
      --t2: #94a3b8;
      --t3: #64748b;
      --sh: 0 10px 15px -3px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--t1);
      line-height: 1.5;
      transition: background-color 0.3s ease;
      min-height: 100dvh;
    }

    button { cursor: pointer; font-family: inherit; transition: all 0.2s ease; }
    button:active { transform: scale(0.96); }

    /* LOADING & LOGIN */
    #loading-screen, #login-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-card {
      width: 90%; max-width: 380px; background: var(--surface);
      padding: 40px 24px; border-radius: 24px; text-align: center; box-shadow: var(--sh);
    }
    .login-logo {
      width: 64px; height: 64px; background: var(--accent-grad);
      border-radius: 18px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;
    }
    .btn-google {
      width: 100%; padding: 14px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    /* HEADER */
    .page-header {
      padding: 50px 20px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .page-sub { font-size: 14px; color: var(--t2); }

    /* AVATAR & TOGGLE */
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2);
      border: 1px solid var(--border); color: var(--accent); font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .theme-toggle {
      width: 44px; height: 26px; background: var(--surface-2); border-radius: 100px;
      border: 1px solid var(--border); position: relative;
    }
    .tt-thumb {
      position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
      background: var(--accent); border-radius: 50%; transition: 0.3s;
    }
    html[data-theme="dark"] .tt-thumb { transform: translateX(18px); }

    /* VIEWS */
    .view { display: none; padding-bottom: 120px; }
    .view.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* CARDS */
    .hero-card, .insight-card, .dash-total, .dash-card, .rec-card, .s-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 20px; margin: 15px 16px; box-shadow: var(--sh);
    }
    .hero-lbl { font-size: 12px; font-weight: 700; color: var(--t2); text-transform: uppercase; }
    .hero-amount { font-size: 32px; font-weight: 800; margin: 4px 0; }
    .pos { color: var(--income); } .neg { color: var(--expense); }

    /* FORMS */
    .form-body { padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 13px; font-weight: 700; color: var(--t2); margin-left: 4px; }
    input {
      background: var(--surface-2); border: 2px solid transparent; border-radius: 12px;
      padding: 14px; font-size: 16px; color: var(--t1); transition: 0.2s;
    }
    input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
    
    .segment {
      display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--surface-2);
      padding: 4px; border-radius: 14px; gap: 4px;
    }
    .segment-btn {
      padding: 10px; border: none; background: transparent; border-radius: 10px;
      font-weight: 600; color: var(--t2); font-size: 14px;
    }
    .segment-btn.active { background: var(--surface); color: var(--t1); box-shadow: var(--sh); }
    .segment-btn.active.gasto { color: var(--expense); }
    .segment-btn.active.ingreso { color: var(--income); }
    .segment-btn.active.ahorro { color: var(--savings); }

    .btn-primary {
      background: var(--accent-grad); color: white; border: none; padding: 16px;
      border-radius: 14px; font-size: 16px; font-weight: 700; margin-top: 10px;
      box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.2);
    }

    /* HISTORIAL ITEMS */
    .rec-card { display: flex; align-items: center; gap: 15px; padding: 16px; margin: 8px 16px; }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; }
    .rec-info { flex: 1; }
    .rec-desc { font-weight: 700; font-size: 15px; }
    .rec-meta { font-size: 12px; color: var(--t3); display: flex; gap: 8px; align-items: center; }
    .rec-monto { font-weight: 800; font-size: 16px; }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 400px; background: rgba(var(--surface), 0.8);
      backdrop-filter: blur(20px); border: 1px solid var(--border);
      border-radius: 100px; display: flex; padding: 6px; gap: 4px; box-shadow: var(--sh); z-index: 100;
    }
    .nav-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border-radius: 100px; border: none; background: transparent;
      color: var(--t2); font-size: 13px; font-weight: 700;
    }
    .nav-btn.active { background: var(--accent); color: white; }

    /* CHARTS */
    .chart-wrap { height: 220px; width: 100%; position: relative; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--t1); color: var(--bg); padding: 12px 24px; border-radius: 100px;
      font-size: 14px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 2000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
  </style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div></div>

<div id="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <h2 class="page-title" style="margin-bottom:8px">Finanzas Pro</h2>
    <p class="page-sub" style="margin-bottom:32px">Gestiona tu dinero de forma inteligente y visual.</p>
    <button class="btn-google" onclick="signIn()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuar con Google
    </button>
  </div>
</div>

<div id="app-wrapper" style="display:none">
  
  <!-- DASHBOARD -->
  <section id="view-dashboard" class="view">
    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub">Tu resumen financiero</p>
      </div>
      <div class="header-right">
        <button class="theme-toggle" onclick="toggleTheme()"><span class="tt-thumb"></span></button>
        <div class="user-avatar"><span class="user-initial"></span></div>
      </div>
    </div>

    <div class="hero-card">
      <p class="hero-lbl">Disponible</p>
      <h2 class="hero-amount" id="hero-amount">$ 0</h2>
      <p class="page-sub">Balance neto actual</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0px;">
        <div class="insight-card" style="margin-right:8px">
            <p class="hero-lbl">Gastos Mes</p>
            <p class="hero-amount neg" id="in-gasto-mes" style="font-size:18px">$ 0</p>
        </div>
        <div class="insight-card" style="margin-left:8px">
            <p class="hero-lbl">Ahorro</p>
            <p class="hero-amount pos" id="in-tasa-ahorro" style="font-size:18px">0%</p>
        </div>
    </div>

    <div class="dash-card">
      <p class="hero-lbl" style="margin-bottom:15px">Histórico 6 meses</p>
      <div class="chart-wrap"><canvas id="chart-monthly"></canvas></div>
    </div>
  </section>

  <!-- FORMULARIO -->
  <section id="view-form" class="view active">
    <div class="page-header">
      <div>
        <h1 class="page-title">Registrar</h1>
        <p class="page-sub">Añade un nuevo movimiento</p>
      </div>
      <div class="header-right">
        <button class="theme-toggle" onclick="toggleTheme()"><span class="tt-thumb"></span></button>
        <div class="user-avatar"><span class="user-initial"></span></div>
      </div>
    </div>

    <div class="form-body">
      <div class="field">
        <label>Tipo de registro</label>
        <div class="segment">
          <button class="segment-btn gasto active" data-tipo="gasto" onclick="selectTipo('gasto')">Gasto</button>
          <button class="segment-btn ingreso" data-tipo="ingreso" onclick="selectTipo('ingreso')">Ingreso</button>
          <button class="segment-btn ahorro" data-tipo="ahorro" onclick="selectTipo('ahorro')">Ahorro</button>
        </div>
      </div>

      <div class="field">
        <label>¿En qué gastaste?</label>
        <input type="text" id="desc" placeholder="Ej: Supermercado" autocomplete="off">
      </div>

      <div class="field">
        <label>Monto</label>
        <input type="text" id="monto" placeholder="$ 0" inputmode="numeric" oninput="fmtMontoLive(this)">
      </div>

      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>

      <div class="field">
        <label>Método de pago</label>
        <div id="metodo-pills" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
      </div>

      <button class="btn-primary" id="guardar-btn" onclick="guardar()">Guardar Registro</button>
    </div>
  </section>

  <!-- HISTORIAL -->
  <section id="view-historial" class="view">
    <div class="page-header">
      <div>
        <h1 class="page-title">Historial</h1>
        <p class="page-sub">Tus últimos movimientos</p>
      </div>
    </div>
    
    <div style="padding: 10px 16px;">
        <input type="search" id="search-input" placeholder="Buscar..." style="width:100%" oninput="setSearch(this.value)">
    </div>

    <div id="lista-gastos"></div>
    <div id="lista-ingresos"></div>
  </section>

  <!-- NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-btn" id="nav-dashboard" onclick="switchView('dashboard')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Stats
    </button>
    <button class="nav-btn active" id="nav-form" onclick="switchView('form')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Registro
    </button>
    <button class="nav-btn" id="nav-historial" onclick="switchView('historial')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Lista
    </button>
  </nav>

</div>

<div class="toast" id="toast"></div>

<script>
  // REEMPLAZA ESTO CON TUS DATOS DE FIREBASE QUE TENÍAS EN EL CÓDIGO ANTERIOR
  const firebaseConfig = {
    apiKey:            "AIzaSyCBMDR_4eS_5OmEqHm_FgDUj00modiwMlg",
    authDomain:        "finanzas-personal-2026.firebaseapp.com",
    projectId:         "finanzas-personal-2026",
    storageBucket:     "finanzas-personal-2026.firebasestorage.app",
    messagingSenderId: "870312850864",
    appId:             "1:870312850864:web:75f920beb48aa6cafed275"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let records = [];
  let currentUser = null;
  let selTipo = 'gasto';
  let selMetod = 'efectivo';
  let searchQuery = '';

  // Tu lógica original (Simplificada para mantener el diseño limpio)
  auth.onAuthStateChanged(user => {
    document.getElementById('loading-screen').style.display = 'none';
    if (user) {
      currentUser = user;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-wrapper').style.display = 'block';
      document.querySelectorAll('.user-initial').forEach(el => el.textContent = user.displayName.charAt(0));
      setupListener(user.uid);
      document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
      renderMetodoPills();
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app-wrapper').style.display = 'none';
    }
  });

  function signIn() {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }

  function setupListener(uid) {
    db.collection('users').doc(uid).collection('registros').onSnapshot(snap => {
      records = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
      updateUI();
    });
  }

  function updateUI() {
    const totI = records.filter(r => r.tipo === 'ingreso').reduce((s, r) => s + r.monto, 0);
    const totG = records.filter(r => r.tipo === 'gasto').reduce((s, r) => s + r.monto, 0);
    const totA = records.filter(r => r.tipo === 'ahorro').reduce((s, r) => s + r.monto, 0);
    
    document.getElementById('hero-amount').textContent = fmtCOP(totI - totG - totA);
    document.getElementById('in-gasto-mes').textContent = fmtCOP(totG);
    document.getElementById('in-tasa-ahorro').textContent = totI > 0 ? Math.round((totA / totI) * 100) + '%' : '0%';

    renderHistorial();
    renderCharts();
  }

  function renderHistorial() {
    const list = records.filter(r => r.desc.toLowerCase().includes(searchQuery.toLowerCase()));
    const container = document.getElementById('lista-gastos');
    container.innerHTML = list.map(r => `
      <div class="rec-card">
        <div class="rec-dot" style="background:var(--${r.tipo})"></div>
        <div class="rec-info">
          <div class="rec-desc">${r.desc}</div>
          <div class="rec-meta">${r.fecha} • ${r.metodo}</div>
        </div>
        <div class="rec-monto ${r.tipo === 'ingreso' ? 'pos' : 'neg'}">${fmtCOP(r.monto)}</div>
      </div>
    `).join('');
  }

  async function guardar() {
    const desc = document.getElementById('desc').value;
    const monto = parseInt(document.getElementById('monto').value.replace(/\D/g, ''));
    const fecha = document.getElementById('fecha').value;

    if(!desc || !monto) return showToast("Faltan datos");

    await db.collection('users').doc(currentUser.uid).collection('registros').add({
      desc, monto, fecha, tipo: selTipo, metodo: selMetod, ts: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('desc').value = '';
    document.getElementById('monto').value = '';
    showToast("¡Guardado con éxito!");
  }

  function selectTipo(tipo) {
    selTipo = tipo;
    document.querySelectorAll('.segment-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tipo === tipo);
    });
  }

  function renderMetodoPills() {
    const metodos = ['Efectivo', 'Débito', 'TC Nu', 'TC Lulo'];
    const container = document.getElementById('metodo-pills');
    container.innerHTML = metodos.map(m => `
      <button class="segment-btn ${selMetod === m ?
